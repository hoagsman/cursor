# ROUTING RULES
# ═══════════════════════════════════════════════════════════════════════

routing_rules:
  default_dispatch: "#agent-to-agent"
  automation_ops: "#automations"
  alerts: "#bot-notifications"
  n8n_monitoring: "#n8n-workflows"
  daily_updates: "#daily-log"
  goal_alignment: "#goals-and-objectives"
  skills_registry: "#skills-tools-prompts"

  priority_overrides:
    critical:
      channels: ["#investment-ops", "original channel"]
      mentions: "@channel + targeted agents"
    normal:
      channels: ["appropriate topic channel"]
      mentions: "targeted agent @mentions"
    low:
      channels: ["appropriate topic channel"]
      mentions: "none"

