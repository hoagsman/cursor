# Alpha Loop Capital — AI Agent Detailed Capabilities
# Detailed configuration for all AI-powered agents
# Last updated: 2026-03-21

version: "1.0.0"

# ─── Primary Orchestration ────────────────────────────────────────────

manus:
  name: Manus
  provider: manus
  tier: primary
  autonomy_level: high
  token_model: on-reaction
  routing:
    primary: slack
    channels: ["#agent-to-agent", "#automations", "#daily-log"]
  orchestration:
    can_spawn_subtasks: true
    can_delegate_to: [computer, claude, cursor, codex, ellie]
    workflow_builder: true
    end_to_end: true
  integrations:
    - slack (read/write/search)
    - iMessage bridge
    - n8n webhook triggers
  constraints:
    - Messages sent in Slack visible in Manus web app
    - Tag @Manus to activate

computer:
  name: Computer
  provider: anthropic
  tier: primary
  autonomy_level: high
  token_model: on-activation
  routing:
    primary: direct-api
    channels: ["#agent-to-agent", "#automations"]
  orchestration:
    can_control_ui: true
    can_browse_web: true
    screen_interaction: true
  integrations:
    - browser automation
    - UI interaction
    - screen capture
  constraints:
    - Requires visual context for UI tasks
    - Best for browser-based workflows

claude:
  name: Claude
  provider: anthropic
  tier: primary
  autonomy_level: high
  token_model: on-reaction
  routing:
    primary: slack
    secondary: claude-desktop
    channels: ["#agent-to-agent", "#automations"]
  orchestration:
    architectural_design: true
    complex_reasoning: true
    feedback_loops: true
  integrations:
    - slack (via Kilo Code / Claude Desktop)
    - MCP servers (all)
  constraints:
    - 200K context window
    - Best for architecture and synthesis tasks

