# Alpha Loop Capital — MCP Server Registry
# Standardized tool access for all agents
# Last updated: 2026-03-21

version: "1.0.0"

mcp_servers:

  # ─── Communication & Collaboration ───────────────────────────────

  slack:
    name: Slack MCP
    provider: slack
    status: connected
    tools:
      - channel read/write
      - search (public + private)
      - user lookup
      - canvas create/read/update
      - thread management
      - scheduled messages
    used_by:
      - manus
      - cursor
      - ellie
      - claude
      - computer

  notion:
    name: Notion MCP
    provider: notion
    status: connected
    tools:
      - page create/read/update
      - database query (SQL mode)
      - search
      - comments
      - data source management
